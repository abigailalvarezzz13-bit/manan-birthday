<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manan's Birthday Bananza</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  background: linear-gradient(#081c3a, #123a7a);
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* PIXEL BROOKLYN SKYLINE */
.skyline {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 120px;
  background:
    linear-gradient(to top, #0d2a5e 40%, transparent 40%),
    repeating-linear-gradient(
      to right,
      #0d2a5e 0px,
      #0d2a5e 20px,
      #123a7a 20px,
      #123a7a 40px
    );
  z-index: -1;
}

.container {
  padding: 40px;
  max-width: 700px;
  margin: auto;
}

h1 {
  color: #7ec8ff;
  text-shadow: 3px 3px #001f3f;
}

/* NUBCAT IMAGE */
#nubcat {
  width: 110px;
  cursor: pointer;
  animation: bounce 1.5s infinite;
  image-rendering: pixelated;
}

@keyframes bounce {
  50% { transform: translateY(-10px); }
}

button {
  display: block;
  margin: 15px auto;
  padding: 12px 20px;
  background: #1e5bb8;
  border: 3px solid #7ec8ff;
  color: white;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #2f7bff;
  transform: scale(1.05);
}

/* CONFETTI GIF */
.confetti {
  position: fixed;
  top: -120px;
  width: 90px;
  pointer-events: none;
  animation: fall 4s linear forwards;
}

@keyframes fall {
  to { transform: translateY(120vh); }
}

.cake {
  font-size: 70px;
  animation: glow 1s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px #7ec8ff; }
  to { text-shadow: 0 0 30px white; }
}

.secret {
  color: #00ffcc;
  font-weight: bold;  
}

a:link {
  color: white;
  text-decoration: none;
}

a:visited {
  color: white;
}

a:hover {
  color: white;
  text-decoration: underline;
}

a:active {
  color: white;
}
</style>
</head>

<body>

<div class="skyline"></div>

<div class="container">
<h1>. ݁₊ ⊹ ݁Manan's Birthday Bananza⊹ . ݁˖ . ݁</h1>

<!-- NUBCAT -->
<img 
  src="https://nubcat.xyz/_next/static/media/mascot.8cb4fc3c.png"
  id="nubcat"
  alt="Nubcat Mascot"
  onclick="catClick()"
/>

<p id="story">
It’s your birthday! Let's celebrate in Brooklyn. 
Nub has summoned you for a legendary quest.
First mission: Fuel up for the day! Choose your snack.
</p>

<div id="choices">
<button onclick="nenes()">Maybe some Mexican cuisine?</button>
<button onclick="apous()">What about some Taiwanese food?</button>
</div>

</div>

<script>

let catClicks = 0;

/* SECRET CAT ENDING */
function catClick() {
  catClicks++;
  if (catClicks === 5) {
    document.getElementById("story").innerHTML =
      "<span class='secret'>SECRET NUBCAT DIMENSION UNLOCKED.</span><br><br>" +
      "Nub declares:<br><br>" +
      "Manan has unlocked Infinite Birthday Luck ₍^ >⩊< ^₎Ⳋ<br><br>" +
      "Bonus Life Activated.";
    document.getElementById("choices").innerHTML =
      "<button onclick='restart()'>Return to Quest</button>";
  }
}

/* QUEST PATHS */

function nenes() {
  document.getElementById("story").innerHTML =
    "You chose Nenes Deli Taqueria 🇲🇽.<br><br>" +
    "Tasty food, but a longer journey!<br><br>" +
    "<a href='https://nenestaqueriausa.com/' target='_blank'>View the Menu 🌮</a><br><br>" +
    "Hmm... how hungry are you? Maybe explore another option.";

  document.getElementById("choices").innerHTML =
    "<button onclick='energyLow()'>Continue Quest</button>";
}

function apous() {
  document.getElementById("story").innerHTML =
    "Nice! A-Pou's Taste 🇹🇼 fuels you with birthday power!<br><br>" +
    "<a href='https://www.apoustasteny.com/crsbdhd1/restaurant/order-online?menu=All+Day+Menu&category=Main+Menu' target='_blank'>View the Menu 🥟</a><br><br>" +
    "A portal opens to your next destination.";

  document.getElementById("choices").innerHTML =
    "<button onclick='energyLow()'>Continue Quest</button>";
}

/* NEW ENERGY BAR SECTION */

function energyLow() {
  document.getElementById("story").innerHTML =
    "Our energy bar is looking a little low.<br><br>" +
    "Let's boost that birthday spirit with our next quest ⚡✨";

  document.getElementById("choices").innerHTML =
    "<button onclick='driftaway()'>Boost Energy</button>";
}


/* UPDATED DRIFTAWAY SECTION */

function driftaway() {
  document.getElementById("story").innerHTML =
    "Welcome to Driftaway Cafe ☕✨<br><br>" +
    "<a href='https://www.driftaway.coffee/' target='_blank'>View the Menu ☕</a><br><br>" +
    "Caffeine Level: MAX.<br><br>" +
    "Next mission: Reach Xanadu Roller Arts.";

  document.getElementById("choices").innerHTML =
    "<button onclick='rollFail()'>Rollerskate There</button>" +
    "<button onclick='teleport()'>Teleport Dramatically</button>";
    
}

function rollFail() {
  document.getElementById("story").innerHTML =
    "You attempt to rollerskate through Brooklyn traffic.<br><br>" +
    "A pigeon defeats you.<br><br>" +
    "Try a smarter method.";
  document.getElementById("choices").innerHTML =
    "<button onclick='bossLevel()'>Enter Girlfriend Boss Level</button>";
}

function teleport() {
  document.getElementById("story").innerHTML =
    "You teleport in blue sparkles ✨<br><br>" +
    "You arrive flawlessly at Xanadu Roller Arts.";
  document.getElementById("choices").innerHTML =
    "<button onclick='driftaway()'>Choose Again</button>";
}

/* GIRLFRIEND BOSS LEVEL */

function bossLevel() {
  document.getElementById("story").innerHTML =
    "ᯓ★GIRLFRIEND BOSS LEVELᯓ★<br><br>" +
    "Abigail appears glowing with birthday energy.<br><br>" +
    "Who planned this legendary day?";
  document.getElementById("choices").innerHTML =
    "<button onclick='bossWin()'>The Love of Your Life</button>" +
    "<button onclick='bossLose()'>Nub</button>";
}

function bossLose() {
  document.getElementById("story").innerHTML =
    "Incorrect. The Girlfriend Boss grows stronger.<br><br>Try again.";
  document.getElementById("choices").innerHTML =
    "<button onclick='bossLevel()'>Retry</button>";
}

function bossWin() {
  document.getElementById("story").innerHTML =
    "Correct.<br><br>" +
    "You have defeated the Girlfriend Boss (she let you win).<br><br>" +
    "Dinner awaits.";
  document.getElementById("choices").innerHTML =
    "<button onclick='dinner()'>Proceed to Dinner</button>";
}

function dinner() {
  document.getElementById("story").innerHTML =
    "Final Quest: Choose Your Dinner Destination.";
  document.getElementById("choices").innerHTML =
    "<button onclick='tabare()'>Tabare Bushwick 🇺🇾</button>" +
    "<button onclick='fandi()'>Fandi Mata 🇮🇹</button>";
}

function tabare() {
  document.getElementById("story").innerHTML =
    "Delicious! Let's try some flavors from Uruguay.<br><br>" +
    "Ready to eat by candlelight?";
  document.getElementById("choices").innerHTML =
    "<button onclick='finale()'>Reveal Birthday Cake</button>";
}

function fandi() {
  document.getElementById("story").innerHTML =
    "Hmm...maybe next time.<br><br>" +
    "Until our next adventure!";
  document.getElementById("choices").innerHTML =
    "<button onclick='dinner()'>Choose Again</button>";
}

/* FINAL SCREEN WITH CONFETTI GIFS */

function finale() {

  const confettiURL = "https://i.pinimg.com/originals/76/87/f4/7687f41886b35677b63ccfb579d8c516.gif";

  for (let i = 0; i < 20; i++) {
    let confetti = document.createElement("img");
    confetti.src = confettiURL;
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "%";
    document.body.appendChild(confetti);
  }

  document.getElementById("story").innerHTML =
    "<div class='cake'>⋆｡‧˚ʚ ୨ৎ ɞ˚‧｡⋆</div><br>" +
    "Happy Birthday Manan.<br><br>" +
    "I cant't wait to travel the world with you!<br>" +
    "Today, let's start in Brooklyn.<br><br>" +
    "There's no one else I'd rather adventure with,<br>" +
    "hand in hand.<br><br>" +
    "Love,<br>Abigail ≽^• ˕ • ྀི≼";

  document.getElementById("choices").innerHTML =
    "<button onclick='restart()'>Play Again</button>";
}

function restart() {
  location.reload();
}

</script>

</body>
</html>
